<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161B2C"/>
      <stop offset="100%" stop-color="#0D1119"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="24.5" fill="none" stroke="#2A3350" stroke-width="2"/>

  <!-- pulse line: fewer points, thicker stroke, flat color — reads clearly
       down to ~16px where gradients/glow/fine dots would just wash out -->
  <polyline points="14,68 38,68 50,42 66,94 80,68 114,68"
    fill="none" stroke="#F2A65A" stroke-width="10"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
